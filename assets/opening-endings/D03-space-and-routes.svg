<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">相交路线与可见范围 / Crossing routes and visible space</title><desc id="desc">An invented room with a blocking table and two crossing movement routes. It is a staging exercise, not a plan or frame from Touch of Evil or Alien.</desc><rect width="1200" height="760" fill="#111111"/><text x="48" y="58" fill="#f6f6ef" font-size="34" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">相交路线与可见范围</text><text x="48" y="90" fill="#f6f6ef" font-size="31" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">Crossing routes and visible space</text><line x1="48" y1="116" x2="1152" y2="116" stroke="#e4ff00" stroke-width="3" /><rect x="70" y="160" width="650" height="470" rx="5" fill="none" stroke="#a3a39b" stroke-width="2"/><text x="88" y="195" fill="#f6f6ef" font-size="23" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">原创房间俯视图</text><text x="88" y="227" fill="#f6f6ef" font-size="20" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">Invented room plan</text><rect x="330" y="320" width="150" height="100" rx="5" fill="#24241f" stroke="#a3a39b" stroke-width="2"/><text x="405" y="360" fill="#f6f6ef" font-size="22" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">桌子遮挡</text><text x="405" y="392" fill="#f6f6ef" font-size="19" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">Table blocks</text><line x1="150" y1="500" x2="610" y2="500" stroke="#e4ff00" stroke-width="3" /><path d="M 600 493 L 610 500 L 600 507" fill="none" stroke="#e4ff00" stroke-width="3"/><text x="145" y="525" fill="#e4ff00" font-size="22" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">携带物品者的路线</text><text x="145" y="557" fill="#e4ff00" font-size="19" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">Object-carrier route</text><line x1="570" y1="230" x2="570" y2="575" stroke="#fafaf1" stroke-width="3" stroke-dasharray="10 7"/><text x="590" y="265" fill="#f6f6ef" font-size="21" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">返回者</text><text x="590" y="297" fill="#f6f6ef" font-size="18" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">Returning person</text><circle cx="570" cy="500" r="13" fill="#e4ff00"/><text x="795" y="320" fill="#f6f6ef" font-size="24" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">路线相交：可能被看见</text><text x="795" y="352" fill="#f6f6ef" font-size="21" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">Crossing: possible discovery</text><text x="795" y="415" fill="#f6f6ef" font-size="24" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">桌后：暂时不可见</text><text x="795" y="447" fill="#f6f6ef" font-size="21" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">Behind table: unseen</text><text x="795" y="510" fill="#f6f6ef" font-size="24" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">画外不等于不存在</text><text x="795" y="542" fill="#f6f6ef" font-size="21" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">Offscreen is not absent</text><line x1="470" y1="370" x2="775" y2="390" stroke="#a3a39b" stroke-width="2" stroke-dasharray="5 5"/><line x1="585" y1="500" x2="775" y2="330" stroke="#a3a39b" stroke-width="2" stroke-dasharray="5 5"/><text x="92" y="592" fill="#f6f6ef" font-size="22" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">摄影机位置可以改变可见范围</text><text x="92" y="624" fill="#f6f6ef" font-size="19" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">Camera position changes visibility</text><text x="48" y="704" fill="#a3a39b" font-size="19" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">原创课堂示意，不是影片画面或通用公式</text><text x="48" y="736" fill="#a3a39b" font-size="16" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">Original teaching schematic—not a film frame or universal rule</text></svg>