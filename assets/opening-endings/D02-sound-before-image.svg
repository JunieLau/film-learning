<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">声源、画面与推断 / Sound source, image and inference</title><desc id="desc">An invented sound-first room exercise. Ambience precedes the room image, inviting a source hypothesis and later revision. Bars are decorative schematic sound, not a sampled film waveform.</desc><rect width="1200" height="760" fill="#111111"/><text x="48" y="58" fill="#f6f6ef" font-size="34" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">声源、画面与推断</text><text x="48" y="90" fill="#f6f6ef" font-size="31" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">Sound source, image and inference</text><line x1="48" y1="116" x2="1152" y2="116" stroke="#e4ff00" stroke-width="3" /><text x="48" y="165" fill="#f6f6ef" font-size="24" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">原创房间练习：先听见，后看见</text><text x="48" y="197" fill="#f6f6ef" font-size="21" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">Original room exercise: hear first, see later</text><text x="48" y="260" fill="#e4ff00" font-size="24" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">声音轨道</text><text x="48" y="292" fill="#e4ff00" font-size="21" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">Sound track</text><text x="48" y="410" fill="#e4ff00" font-size="24" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">图像轨道</text><text x="48" y="442" fill="#e4ff00" font-size="21" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">Image track</text><text x="48" y="560" fill="#e4ff00" font-size="24" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">观众推断</text><text x="48" y="592" fill="#e4ff00" font-size="21" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">Viewer inference</text><rect x="280" y="208" width="840" height="110" rx="5" fill="none" stroke="#a3a39b" stroke-width="2"/><text x="310" y="250" fill="#f6f6ef" font-size="24" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">环境声已经存在</text><text x="310" y="282" fill="#f6f6ef" font-size="21" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">Ambience is already present</text><line x1="700" y1="250" x2="700" y2="280" stroke="#e4ff00" stroke-width="3" /><line x1="720" y1="235" x2="720" y2="295" stroke="#e4ff00" stroke-width="3" /><line x1="740" y1="245" x2="740" y2="285" stroke="#e4ff00" stroke-width="3" /><line x1="760" y1="230" x2="760" y2="300" stroke="#e4ff00" stroke-width="3" /><line x1="780" y1="255" x2="780" y2="275" stroke="#e4ff00" stroke-width="3" /><line x1="800" y1="240" x2="800" y2="290" stroke="#e4ff00" stroke-width="3" /><line x1="820" y1="225" x2="820" y2="305" stroke="#e4ff00" stroke-width="3" /><line x1="840" y1="245" x2="840" y2="285" stroke="#e4ff00" stroke-width="3" /><line x1="860" y1="233" x2="860" y2="297" stroke="#e4ff00" stroke-width="3" /><line x1="880" y1="249" x2="880" y2="281" stroke="#e4ff00" stroke-width="3" /><line x1="900" y1="230" x2="900" y2="300" stroke="#e4ff00" stroke-width="3" /><line x1="920" y1="242" x2="920" y2="288" stroke="#e4ff00" stroke-width="3" /><line x1="940" y1="253" x2="940" y2="277" stroke="#e4ff00" stroke-width="3" /><line x1="960" y1="238" x2="960" y2="292" stroke="#e4ff00" stroke-width="3" /><line x1="980" y1="247" x2="980" y2="283" stroke="#e4ff00" stroke-width="3" /><line x1="1000" y1="231" x2="1000" y2="299" stroke="#e4ff00" stroke-width="3" /><line x1="1020" y1="245" x2="1020" y2="285" stroke="#e4ff00" stroke-width="3" /><rect x="280" y="350" width="360" height="110" rx="5" fill="#000" stroke="#a3a39b" stroke-width="2"/><text x="460" y="392" fill="#f6f6ef" font-size="24" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">黑场：暂不见声源</text><text x="460" y="424" fill="#f6f6ef" font-size="21" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">Black: source unseen</text><rect x="640" y="350" width="480" height="110" rx="5" fill="#20201d" stroke="#a3a39b" stroke-width="2"/><text x="880" y="392" fill="#f6f6ef" font-size="24" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">房间出现：寻找声源</text><text x="880" y="424" fill="#f6f6ef" font-size="21" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">Room appears: seek source</text><line x1="640" y1="195" x2="640" y2="620" stroke="#e4ff00" stroke-width="2" stroke-dasharray="6 8"/><text x="280" y="550" fill="#f6f6ef" font-size="24" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">“声音来自哪里？”</text><text x="280" y="582" fill="#f6f6ef" font-size="21" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">“Where is the sound?”</text><line x1="610" y1="563" x2="690" y2="563" stroke="#e4ff00" stroke-width="3" /><path d="M 680 556 L 690 563 L 680 570" fill="none" stroke="#e4ff00" stroke-width="3"/><text x="730" y="550" fill="#f6f6ef" font-size="24" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">“我的假设成立吗？”</text><text x="730" y="582" fill="#f6f6ef" font-size="21" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">“Does my guess hold?”</text><text x="280" y="640" fill="#a3a39b" font-size="21" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">示意长度不是秒数 / Diagram widths are not seconds</text><text x="48" y="704" fill="#a3a39b" font-size="19" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">原创课堂示意，不是影片画面或通用公式</text><text x="48" y="736" fill="#a3a39b" font-size="16" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">Original teaching schematic—not a film frame or universal rule</text></svg>